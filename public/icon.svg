<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <clipPath id="card"><rect width="512" height="512" rx="118"/></clipPath>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1440"/><stop offset=".55" stop-color="#071a4f"/><stop offset="1" stop-color="#03102e"/>
  </linearGradient>
  <filter id="blur60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
  <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="blur6"  x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft"   x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  <linearGradient id="glassFill" x1=".1" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".46"/>
    <stop offset=".45" stop-color="#bfe4ff" stop-opacity=".16"/>
    <stop offset="1" stop-color="#7aa8ff" stop-opacity=".10"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset=".4" stop-color="#9fdcff" stop-opacity=".35"/>
    <stop offset=".75" stop-color="#8ea2ff" stop-opacity=".18"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity=".6"/>
  </linearGradient>
  <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a8e3ff"/>
  </linearGradient>
  <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#d6f1ff" stop-opacity=".85"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="bubbleClip"><path id="bp" d="M200,124 H312 A88,88 0 0 1 400,212 V252 A88,88 0 0 1 312,340 H252 L176,404 C170,409 162,404 164,397 L176,337 A88,88 0 0 1 112,252 V212 A88,88 0 0 1 200,124 Z"/></clipPath>
</defs>

<g clip-path="url(#card)">
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <!-- nebula light -->
  <circle cx="120" cy="120" r="150" fill="#22b8ff" opacity=".85" filter="url(#blur60)"/>
  <circle cx="420" cy="420" r="160" fill="#7a4dff" opacity=".85" filter="url(#blur60)"/>
  <circle cx="430" cy="110" r="90"  fill="#2d6bff" opacity=".8"  filter="url(#blur30)"/>
  <circle cx="90"  cy="430" r="80"  fill="#00e0d0" opacity=".45" filter="url(#blur30)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="70"  cy="70"  r="2.4" opacity=".9"/><circle cx="452" cy="60"  r="2"   opacity=".7"/>
    <circle cx="470" cy="250" r="2.2" opacity=".6"/><circle cx="48"  cy="290" r="1.8" opacity=".6"/>
    <circle cx="300" cy="60"  r="1.6" opacity=".55"/><circle cx="410" cy="470" r="2.2" opacity=".7"/>
    <circle cx="150" cy="466" r="1.8" opacity=".5"/><circle cx="240" cy="44"  r="1.4" opacity=".5"/>
  </g>

  <!-- frosted bubble: blurred backdrop copy clipped to the bubble = glass -->
  <g clip-path="url(#bubbleClip)">
    <g filter="url(#soft)">
      <circle cx="120" cy="120" r="150" fill="#22b8ff" opacity=".55"/>
      <circle cx="420" cy="420" r="160" fill="#7a4dff" opacity=".55"/>
    </g>
    <rect x="100" y="110" width="320" height="310" fill="#ffffff" opacity=".07"/>
  </g>
  <!-- soft shadow -->
  <path d="M200,124 H312 A88,88 0 0 1 400,212 V252 A88,88 0 0 1 312,340 H252 L176,404 C170,409 162,404 164,397 L176,337 A88,88 0 0 1 112,252 V212 A88,88 0 0 1 200,124 Z" fill="#000" opacity=".35" transform="translate(0 16)" filter="url(#blur30)"/>
  <path d="M200,124 H312 A88,88 0 0 1 400,212 V252 A88,88 0 0 1 312,340 H252 L176,404 C170,409 162,404 164,397 L176,337 A88,88 0 0 1 112,252 V212 A88,88 0 0 1 200,124 Z" fill="url(#glassFill)" stroke="url(#rim)" stroke-width="5" stroke-linejoin="round"/>
  <!-- top gloss -->
  <path d="M170,150 C210,132 300,128 350,146" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="7" stroke-linecap="round" filter="url(#blur6)"/>
  <path d="M150,176 C156,160 170,150 188,143" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/>

  <!-- orbit ring + planet -->
  <g transform="rotate(-24 256 232)">
    <ellipse cx="256" cy="232" rx="104" ry="32" fill="none" stroke="url(#orbit)" stroke-width="4"/>
    <circle cx="360" cy="232" r="9" fill="#bfeaff"/>
    <circle cx="360" cy="232" r="16" fill="#7fd4ff" opacity=".45" filter="url(#blur6)"/>
  </g>
  <!-- sparkle -->
  <path d="M256,158 Q263,224 332,232 Q263,240 256,306 Q249,240 180,232 Q249,224 256,158 Z" fill="#7fd8ff" opacity=".8" filter="url(#blur6)"/>
  <path d="M256,166 Q262,225 322,232 Q262,239 256,298 Q250,239 190,232 Q250,225 256,166 Z" fill="url(#star)"/>
  <circle cx="256" cy="232" r="7" fill="#fff"/>
</g>
</svg>