<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07162f"><title>ChatSpace</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/extra.css">
<script src="/prefs.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar glass">
    <div class="side-top">
      <div class="brand"><img class="brand-icon" src="/icon-192.png" width="28" height="28" alt="">ChatSpace</div>
      <button id="profileBtn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
    </div>
    <div id="meCard" class="me-card"></div>
    <div class="side-heading"><span>Friends</span><button id="addFriendBtn" class="round-btn" title="Add friend">+</button></div>
    <div id="friends" class="friends"></div>
    <div class="side-bottom"><button id="logoutBtn" class="ghost-btn">Log out</button></div>
  </aside>

  <main class="chat-panel glass">
    <header class="chat-head">
      <button id="backBtn" class="mobile-back">‹</button>
      <div id="chatPerson" class="chat-person empty"><div class="avatar big"></div><div><strong>Select a friend</strong><span>Start a private conversation</span></div></div>
      <div id="typing" class="typing"></div>
    </header>
    <section id="messages" class="messages">
      <div class="empty-chat"><div class="empty-icon">✦</div><h2>Choose your person</h2><p>Your messages will appear here.</p></div>
    </section>
    <footer id="composer" class="composer disabled">
      <input id="fileInput" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" hidden>
      <button id="attachBtn" class="icon-btn" title="Photo or video">＋</button>
      <button id="emojiBtn" class="icon-btn emoji-btn" title="Emoji" aria-label="Emoji" type="button">😊</button>
      <button id="oneTimeBtn" class="one-time" title="One-time message">1×</button>
      <textarea id="textInput" rows="1" placeholder="Message…" disabled></textarea>
      <button id="sendBtn" class="send-btn" disabled>➤</button>
      <div id="emojiPanel" class="emoji-panel glass hidden" role="dialog" aria-label="Emoji picker"></div>
    </footer>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box glass"><button id="closeModal" class="modal-close">×</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast"></div>
<script src="/socket.io/socket.io.js"></script><script src="/chat.js"></script>
</body></html>
